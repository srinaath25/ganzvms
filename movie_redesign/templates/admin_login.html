{% extends 'auth.html' %}{% set heading='Cinema command center.' %}{% set subheading='Restricted access for the people who make the screens happen.' %}
{% block form %}<h2>Administrator sign in</h2>{% if error %}<div class="alert error">{{ error }}</div>{% endif %}<form method="post" class="form-grid"><label>Admin email<input name="email" type="email" autocomplete="username" required></label><label>Admin password<input name="password" type="password" autocomplete="current-password" required></label><button class="primary-btn magnetic" type="submit">Enter operations <i data-lucide="arrow-right"></i></button></form><div class="auth-links"><a href="{{ url_for('login') }}">Switch to viewer portal</a></div>{% endblock %}
